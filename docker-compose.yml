# Dual setup: day-to-day API debug uses backend/.venv + uvicorn.
# Use this compose file for prod-like / integrated stack runs.
#
#   Local API:   cd backend && .\.venv\Scripts\Activate.ps1 ; uvicorn app.main:app --reload
#   Full stack:  docker compose up
#
# Postgres / Redis / worker are profile "full" until Phases 5–6.

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/storage
      - ./backend/app:/app/app
    environment:
      STORAGE_ROOT: /storage
      DEBUG: "true"
    # command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

