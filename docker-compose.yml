# Dual setup: day-to-day API debug uses backend/.venv + uvicorn.
# Use this compose file for Linux-parity runs (WeasyPrint works here).
#
#   Full stack:    docker compose up --build          # UI :5173, API :8008
#   API only:      docker compose up --build api
#   Docker tests:  docker compose run --rm test
#   Local API:     cd backend && .\.venv\Scripts\Activate.ps1 ; uvicorn app.main:app --reload
#
# Postgres / Redis / worker are profile "full" until Phases 5–6.

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    ports:
      # Host 8008 avoids clashes with other local services on 8000.
      - "8008:8000"
    volumes:
      - ./storage:/storage
    environment:
      STORAGE_ROOT: /storage
      DEBUG: "true"
      APP_NAME: document-processing-service
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Phase 4 UI — nginx serves the Vite build and proxies /api to `api`.
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

  # Full backend suite in Linux (WeasyPrint + PyMuPDF). Expect 0 skips for WeasyPrint.
  test:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    environment:
      WEASYPRINT_REQUIRED: "1"
      STORAGE_ROOT: /tmp/test-storage
    # No host bind of Windows paths for tests — hermetic image contents.

